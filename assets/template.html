<title>Mapa de Equipamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* iso3d dashboard v1 · cena 3D ortográfica (SVG) à esquerda, painel de detalhes à direita, tabela de portas abaixo */
:root {
  --bg:#0f141a; --surface:#161d25; --surface-2:#1c2530; --line:#2a3542; --fg:#e2e8ef; --muted:#8a97a7; --accent:#3fb6e6;
  --ok:#41d18a; --alarm:#ff9a3c; --down:#ff5d5d; --disabled:#6b7685; --off:#3a434e;
  --m-fiber-sm:#f4c430; --m-fiber-mm:#2ec4c4; --m-dac:#8c96a2; --m-aoc:#e07bd0; --m-cat5e:#5b9cf0; --m-cat6:#4a8fe7; --m-power:#e05a4f; --m-coax:#b9c0c8; --m-e1:#c99b6d; --m-generic:#b39ddb;
  --scene:#121920; --dot:#1d2733; --shadow:#000000; --floor:#1a222c; --floor-line:#2b3744;
  /* cores físicas dos equipamentos (iguais nos dois temas) */
  --light-front:#aab2bb; --light-top:#c7ced5; --light-side:#7e8791; --light-card:#9aa3ad; --light-edge:#66707b;
  --dark-front:#2d353e; --dark-top:#3d4650; --dark-side:#232a32; --dark-card:#38414b; --dark-edge:#15191e;
  --white-front:#dfe3e7; --white-top:#eef1f3; --white-side:#b9c0c7; --white-card:#cfd5da; --white-edge:#8f99a3;
  --black-front:#1d2126; --black-top:#2a3036; --black-side:#15181c; --black-card:#262b31; --black-edge:#0a0c0e;
  --post-front:#3a424c; --post-top:#4a535e; --post-side:#2b323a;
  --cage:#1b2026; --vent:#4b545e; --ink-dark:#1a2129; --ink-light:#e3e9ef; --screw:#c9d0d6;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg:#e8ecf0; --surface:#f9fbfc; --surface-2:#eff2f5; --line:#d2d9e1; --fg:#16202b; --muted:#566373; --accent:#1f8fc4;
  --ok:#1c9a59; --alarm:#d8731a; --down:#d63c3c; --disabled:#8d98a4; --off:#a3adb8;
  --m-fiber-sm:#e0ad00; --m-fiber-mm:#13a5a5; --m-dac:#5f6b78; --m-aoc:#c55bb4; --m-cat5e:#3f7fd6; --m-cat6:#2f74d0; --m-power:#d0453a; --m-coax:#7c8691; --m-e1:#a97a4a; --m-generic:#7e63c4;
  --scene:#f3f5f7; --dot:#dde3e9; --shadow:#33404d; --floor:#e4e9ee; --floor-line:#c9d1da;
  color-scheme: light;
} }
:root[data-theme="light"] {
  --bg:#e8ecf0; --surface:#f9fbfc; --surface-2:#eff2f5; --line:#d2d9e1; --fg:#16202b; --muted:#566373; --accent:#1f8fc4;
  --ok:#1c9a59; --alarm:#d8731a; --down:#d63c3c; --disabled:#8d98a4; --off:#a3adb8;
  --m-fiber-sm:#e0ad00; --m-fiber-mm:#13a5a5; --m-dac:#5f6b78; --m-aoc:#c55bb4; --m-cat5e:#3f7fd6; --m-cat6:#2f74d0; --m-power:#d0453a; --m-coax:#7c8691; --m-e1:#a97a4a; --m-generic:#7e63c4;
  --scene:#f3f5f7; --dot:#dde3e9; --shadow:#33404d; --floor:#e4e9ee; --floor-line:#c9d1da;
  color-scheme: light;
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1520px; margin: 0 auto; padding: 20px 20px 40px; display: grid; gap: 16px; }
@media (max-width: 600px) { .wrap { padding: 14px 16px 32px; } }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.eyebrow { font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font: 700 32px/1.05 var(--f-display); letter-spacing: .01em; margin: 6px 0 0; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; display: grid; gap: 1px; min-width: 88px; }
.chip b { font: 600 17px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
.chip span { font-size: 11px; color: var(--muted); }
.chip.ok b { color: var(--ok); } .chip.alarm b, .chip.warn b { color: var(--alarm); } .chip.down b, .chip.crit b { color: var(--down); } .chip.info b { color: var(--accent); }
.main { display: grid; grid-template-columns: minmax(0,1fr) 370px; gap: 16px; align-items: start; }
@media (max-width: 980px) { .main { grid-template-columns: minmax(0,1fr); } }
.stage { position: relative; background-color: var(--scene); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 18px 18px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; height: 700px; min-width: 0; }
@media (max-width: 980px) { .stage { height: 540px; } }
@media (max-width: 600px) { .stage { height: 450px; } }
#scene { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
#scene.panning { cursor: grabbing; }
#scene:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.toolbar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; pointer-events: none; }
.toolbar > * { pointer-events: auto; }
.tb-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: start; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 2px; gap: 2px; }
.seg button, .tb-btn { font: 500 12px/1 var(--f-body); color: var(--muted); background: transparent; border: 0; border-radius: 5px; padding: 7px 9px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.seg button:hover, .tb-btn:hover { color: var(--fg); }
.tb-btn { background: var(--surface); border: 1px solid var(--line); min-width: 32px; font-family: var(--f-mono); font-size: 14px; padding: 6px 9px; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { position: absolute; left: 10px; bottom: 10px; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; display: flex; flex-wrap: wrap; gap: 5px 12px; font-size: 11.5px; color: var(--muted); max-width: calc(100% - 20px); }
.legend i { display: inline-block; vertical-align: middle; margin-right: 5px; }
.lg-dot { width: 8px; height: 8px; border-radius: 50%; }
.lg-line { width: 18px; height: 3px; border-radius: 2px; }
.hint { position: absolute; right: 12px; bottom: 12px; font-size: 11px; color: var(--muted); text-align: right; }
@media (max-width: 1099px) { .hint { display: none; } }
@media (min-width: 1100px) { .legend { max-width: calc(100% - 360px); } }
#tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font: 12px/1.4 var(--f-mono); white-space: nowrap; box-shadow: 0 6px 20px rgb(0 0 0 / .25); z-index: 3; }
#gl { position: absolute; inset: 0; }
#gl canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#gl canvas:active { cursor: grabbing; }
.gl-msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--muted); }
.fatal { position: absolute; inset: 60px 20px auto; background: var(--surface); border: 1px solid var(--down); border-radius: 8px; padding: 14px; font: 13px/1.5 var(--f-mono); color: var(--fg); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.panel h2 { font: 600 13px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
.panel h3 { font: 600 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 4px 0 0; }
.pid { font: 700 30px/1.05 var(--f-display); letter-spacing: .02em; overflow-wrap: anywhere; }
.pid-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; padding: 5px 8px; border-radius: 99px; border: 1px solid currentColor; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.up { color: var(--ok); } .pill.alarm { color: var(--alarm); } .pill.down { color: var(--down); } .pill.disabled, .pill.free { color: var(--muted); }
dl.kv { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 6px 14px; margin: 0; }
dl.kv dt { color: var(--muted); font-size: 12.5px; }
dl.kv dd { margin: 0; text-align: right; font: 500 13px var(--f-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.field { display: grid; gap: 5px; }
.field label { font-size: 12px; color: var(--muted); }
.field select, .field input, textarea, .filters input, .filters select { font: 13px var(--f-body); color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0; }
.row2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; }
textarea { font-family: var(--f-mono); font-size: 11.5px; min-height: 160px; resize: vertical; }
.btn { font: 500 12.5px/1 var(--f-body); color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 11px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; text-decoration: underline; text-underline-offset: 2px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.port-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 5px; }
.port-grid button { font: 500 11px/1.1 var(--f-mono); padding: 7px 4px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.port-grid button::after { content: ""; position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--off); }
.port-grid button.st-up::after { background: var(--ok); } .port-grid button.st-alarm::after { background: var(--alarm); } .port-grid button.st-down::after { background: var(--down); }
.note { font-size: 12px; color: var(--muted); }
.issues { margin: 0; padding-left: 18px; font-size: 12.5px; display: grid; gap: 4px; }
.issues .erro { color: var(--down); } .issues .aviso { color: var(--alarm); }
details.io summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
details.io[open] { display: grid; gap: 8px; }
.toast { font-size: 12px; color: var(--ok); }
.tablecard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 6px; display: grid; gap: 10px; min-width: 0; }
.tablehead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; }
.tablehead h2 { font: 600 13px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters input { width: 240px; max-width: 100%; }
.filters select { width: auto; max-width: 100%; }
.tscroll { overflow: auto; max-height: 440px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { position: sticky; top: 0; background: var(--surface); text-align: left; font: 600 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.mono { font-family: var(--f-mono); }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
tbody tr.sel td { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--off); }
.dot.st-up { background: var(--ok); } .dot.st-alarm { background: var(--alarm); } .dot.st-down { background: var(--down); } .dot.st-disabled { background: var(--disabled); }

/* SVG */
.f-light.front, .f-light.rear { fill: var(--light-front); } .f-light.top { fill: var(--light-top); } .f-light.side { fill: var(--light-side); }
.f-dark.front, .f-dark.rear { fill: var(--dark-front); } .f-dark.top { fill: var(--dark-top); } .f-dark.side { fill: var(--dark-side); }
.f-white.front, .f-white.rear { fill: var(--white-front); } .f-white.top { fill: var(--white-top); } .f-white.side { fill: var(--white-side); }
.f-black.front, .f-black.rear { fill: var(--black-front); } .f-black.top { fill: var(--black-top); } .f-black.side { fill: var(--black-side); }
.f-post.front, .f-post.rear { fill: var(--post-front); } .f-post.top { fill: var(--post-top); } .f-post.side { fill: var(--post-side); }
.face { stroke: var(--shadow); stroke-opacity: .45; stroke-width: .5; }
.device.sel .face { stroke: var(--accent); stroke-opacity: 1; stroke-width: 1.4; }
.card-light { fill: var(--light-card); stroke: var(--light-edge); stroke-width: .5; }
.card-dark { fill: var(--dark-card); stroke: var(--dark-edge); stroke-width: .5; }
.card-white { fill: var(--white-card); stroke: var(--white-edge); stroke-width: .5; }
.card-black { fill: var(--black-card); stroke: var(--black-edge); stroke-width: .5; }
.slot:hover rect.cardface { filter: brightness(1.12); }
.slot.sel rect.cardface { stroke: var(--accent); stroke-width: 1.2; }
.filler { fill: color-mix(in srgb, var(--light-card) 85%, #000); stroke: var(--light-edge); stroke-width: .4; }
.vent { fill: var(--vent); }
.screw { fill: var(--screw); stroke: #59636e; stroke-width: .3; }
.ink-dark { fill: var(--ink-dark); } .ink-light { fill: var(--ink-light); }
.silk { font-family: var(--f-mono); font-weight: 600; letter-spacing: .03em; }
.silk-d { font-family: var(--f-display); font-weight: 700; letter-spacing: .05em; }
.display { fill: #0b1712; stroke: #000; stroke-width: .3; }
.cage { fill: var(--cage); }
.cage-in { fill: #07090b; }
.adapter-sc { fill: #2f6fd0; } .adapter-apc { fill: #23935a; } .adapter-lc { fill: #6f7a86; }
.plug { stroke: #0b0d10; stroke-width: .25; }
.pnum { font: 600 3px var(--f-mono); fill: #eef2f5; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.pnum.on { fill: #101418; }
.stripe { fill: var(--off); }
.st-up { fill: var(--ok); } .st-alarm { fill: var(--alarm); } .st-down { fill: var(--down); } .st-disabled { fill: var(--disabled); } .st-free { fill: var(--off); }
.led { fill: var(--off); }
.port { cursor: pointer; }
.port:hover .cage { stroke: var(--fg); stroke-width: .5; }
.ring { fill: none; stroke: var(--fg); stroke-width: 1; }
.floor { fill: var(--floor); stroke: var(--floor-line); stroke-width: 1; }
.floor-label { font: 700 26px var(--f-display); fill: var(--muted); letter-spacing: .06em; }
.casing { fill: none; stroke: var(--shadow); stroke-opacity: .5; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.cable { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.hit { fill: none; stroke: transparent; stroke-width: 8; pointer-events: stroke; cursor: pointer; }
g.cab.down .cable { stroke-dasharray: 4 3; }
g.cab.alarm .casing { stroke: var(--alarm); stroke-opacity: .9; }
g.cab.down .casing { stroke: var(--down); stroke-opacity: .8; }
g.cab.behind { opacity: .3; }
g.cab.dim { opacity: .16; }
g.cab.hot .casing { stroke-width: 5.5; stroke-opacity: .75; }
g.cab.hot .cable { stroke-width: 2.8; }
.flow { fill: none; stroke: #fff; stroke-width: 1.1; stroke-dasharray: 2 10; stroke-linecap: round; opacity: .9; animation: flow 1.1s linear infinite; pointer-events: none; }
@keyframes flow { to { stroke-dashoffset: -24; } }
@media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="eyebrow">Mapa de equipamentos</div>
      <h1 id="title">Carregando…</h1>
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <div class="main">
    <div class="stage" id="stage">
      <svg id="scene" tabindex="0" xmlns="http://www.w3.org/2000/svg" aria-label="Cena 3D dos equipamentos e cabos">
        <defs>
          <pattern id="p-grille" width="3" height="8" patternUnits="userSpaceOnUse"><rect x=".5" y=".8" width="1.6" height="6.4" rx=".8" class="vent"/></pattern>
          <pattern id="p-perf" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r=".9" class="vent"/></pattern>
          <pattern id="p-slits" width="10" height="5" patternUnits="userSpaceOnUse"><rect x="1.5" y="1.8" width="7" height="1.4" rx=".7" class="vent"/></pattern>
          <pattern id="p-hex" width="4.6" height="4" patternUnits="userSpaceOnUse"><circle cx="1.15" cy="1" r=".85" class="vent"/><circle cx="3.45" cy="3" r=".85" class="vent"/></pattern>
        </defs>
        <g id="world"></g>
      </svg>
      <div id="gl" hidden></div>
      <div class="toolbar">
        <div class="tb-group">
          <div class="seg" role="group" aria-label="Modo de visualização">
            <button type="button" data-mode="svg" aria-pressed="true">Desenho</button>
            <button type="button" data-mode="3d" aria-pressed="false">3D</button>
          </div>
          <div class="seg" role="group" aria-label="Vistas prontas">
            <button type="button" data-view="iso" aria-pressed="true">Isométrico</button>
            <button type="button" data-view="front" aria-pressed="false">Frente</button>
            <button type="button" data-view="side" aria-pressed="false">Lateral</button>
            <button type="button" data-view="rear" aria-pressed="false">Traseira</button>
            <button type="button" data-view="top" aria-pressed="false">Topo</button>
          </div>
          <div class="seg" role="group" aria-label="Ação do arrasto" id="drag-seg">
            <button type="button" data-drag="rotate" aria-pressed="true">⟲ Girar</button>
            <button type="button" data-drag="pan" aria-pressed="false">✥ Mover</button>
          </div>
        </div>
        <div class="tb-group">
          <div class="seg" role="group" aria-label="Cabos">
            <button type="button" data-cab="all" aria-pressed="true">Todos os cabos</button>
            <button type="button" data-cab="sel" aria-pressed="false">Só seleção</button>
            <button type="button" data-cab="none" aria-pressed="false">Ocultar</button>
          </div>
          <button type="button" class="tb-btn" id="z-out" aria-label="Afastar">−</button>
          <button type="button" class="tb-btn" id="z-in" aria-label="Aproximar">+</button>
          <button type="button" class="tb-btn" id="z-fit" aria-label="Enquadrar tudo">⤢</button>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="hint"><span id="angle"></span><br><span id="hint-text">Arraste para girar · botão direito ou Shift move · roda ou pinça dá zoom · setas giram</span></div>
      <div id="tip" hidden></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

  <section class="tablecard">
    <div class="tablehead">
      <h2>Portas</h2>
      <div class="filters">
        <input id="q" type="search" placeholder="Buscar porta, equipamento, descrição…" aria-label="Buscar">
        <select id="f-dev" aria-label="Filtrar equipamento"><option value="">Todos os equipamentos</option></select>
        <select id="f-st" aria-label="Filtrar status">
          <option value="">Todos os status</option><option value="up">Ativo</option><option value="alarm">Alarme</option>
          <option value="down">Fora</option><option value="disabled">Desabilitado</option><option value="free">Livre</option>
        </select>
        <select id="f-use" aria-label="Filtrar uso">
          <option value="">Com e sem cabo</option><option value="linked">Só com cabo</option><option value="unlinked">Só sem cabo</option>
        </select>
      </div>
    </div>
    <div class="tscroll">
      <table>
        <thead><tr><th>Equipamento</th><th>Porta</th><th>Tipo</th><th>Status</th><th>Conectada a</th><th>Descrição</th><th>Métricas</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

/* ---------- Exportação draw.io ----------
   Um bloco por rack: coluna "frente" e coluna "traseira" (faces como SVG vetorial), cada porta vira um
   ponto conectável e cada cabo vira uma ligação ortogonal com a cor do tipo de cabo. */
function exportDrawio() {
  CSS_SA = null;
  const X = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const b64 = s => btoa(unescape(encodeURIComponent(s)));

  const out = [], portCell = new Map();
  const groups = [...IDX.racks.values()].sort((a, b) => a.x - b.x || a.z - b.z)
    .map(r => ({ title: r.name || r.id, devs: [...IDX.dev.values()].filter(i => i.d.rack === r.id) }));
  const free = [...IDX.dev.values()].filter(i => !i.d.rack || !IDX.racks.has(i.d.rack));
  if (free.length) groups.push({ title: 'Fora de rack', devs: free, free: true });
  const text = (x, y, w, t) => out.push(`<mxCell id="${nid()}" value="${X(t)}" style="text;html=0;fontSize=16;fontStyle=1;align=left;verticalAlign=middle;" vertex="1" parent="1"><mxGeometry x="${fx(x)}" y="${fx(y)}" width="${fx(w)}" height="30" as="geometry"/></mxCell>`);
  let gx = 0;

    if (!g.devs.length) continue;
    const W = Math.max(...g.devs.map(i => i.box.w)), top = Math.max(...g.devs.map(i => i.box.y + i.box.h));
    const ypos = new Map(); let fy = 0;
    g.devs.slice().sort((a, b) => (b.box.y + b.box.h) - (a.box.y + a.box.h)).forEach(i => {
      if (g.free) { ypos.set(i.id, fy); fy += i.box.h + 60; } else ypos.set(i.id, top - (i.box.y + i.box.h));
    });
    for (const [face, cx] of [['front', gx], ['rear', gx + W + 260]]) {
      text(cx, -50, W, `${g.title} · ${face === 'front' ? 'frente' : 'traseira'}`);
      for (const i of g.devs) {
        const [fw, fh] = FACE_DIM[face](i.box), x0 = cx + (W - fw) / 2, y0 = ypos.get(i.id);
        out.push(`<mxCell id="${nid()}" value="${X(i.d.name || i.id)}" style="shape=image;imageAspect=0;image=data:image/svg+xml,${b64(faceSVG(i, face))};labelPosition=left;verticalLabelPosition=middle;align=right;verticalAlign=middle;spacingRight=8;fontSize=12;" vertex="1" parent="1"><mxGeometry x="${fx(x0)}" y="${fx(y0)}" width="${fx(fw)}" height="${fx(fh)}" as="geometry"/></mxCell>`);
        i.ports.filter(p => p.face === face).forEach(p => {
          const id = nid(), ps = portState(p.ref) || {};
          portCell.set(p.ref, id);
          out.push(`<UserObject id="${id}" label="" tooltip="${X(`${portName(p)} · ${p.type}${ps.desc ? ' · ' + ps.desc : ''}`)}" ref="${X(p.ref)}" status="${X(statusOf(p.ref))}"><mxCell style="rounded=0;fillColor=none;strokeColor=none;" vertex="1" parent="1"><mxGeometry x="${fx(x0 + p.x)}" y="${fx(y0 + p.y)}" width="${fx(p.w)}" height="${fx(p.h)}" as="geometry"/></mxCell></UserObject>`);
        });
      }
    }

  }
  IDX.link.forEach(l => {
    const s = portCell.get(l.a), t = portCell.get(l.b);
    if (!s || !t) return;
    const media = MEDIA[l.media] ? l.media : 'generic', c = l.color || cssVar('--m-' + media);

/* ---------- API para dados ao vivo ----------
   IsoDash.update({ ports: { "olt1:1/0": { status: "alarm", metrics: { "Rx": "-27.8 dBm" } } }, links: { "L3": { status: "down" } }, devices: { "olt1": { status: "alarm" } } })
   Mescla o estado, redesenha e não salva no navegador (dados ao vivo vêm sempre da fonte). */
window.IsoDash = {
  get data() { return data; },
  update(patch = {}) {
    for (const [ref, v] of Object.entries(patch.ports || {})) {
      const p = IDX.port.get(ref); if (!p) continue;
      const d = p.info.d; d.ports ||= {}; const cur = d.ports[p.key] ||= {};
      if (v.metrics) cur.metrics = { ...(cur.metrics || {}), ...v.metrics };
      for (const k of Object.keys(v)) if (k !== 'metrics') cur[k] = v[k];
    }
    for (const [id, v] of Object.entries(patch.links || {})) { const l = IDX.link.get(id); if (l) Object.assign(l, v); }
    for (const [id, v] of Object.entries(patch.devices || {})) { const i = IDX.dev.get(id); if (i) Object.assign(i.d, v); }
    refresh();
  },
  select(ref) { sel = ref.includes(':') ? { kind: 'port', ref } : IDX.link.has(ref) ? { kind: 'link', id: ref } : { kind: 'device', id: ref }; refresh(); },
  setView, fit, issues: () => ISSUES.slice(),
  // Modo de visualização: 'svg' (desenho isométrico) ou '3d' (three.js). Retorna uma Promise<boolean>.
  mode: setMode,
  // Retorna o XML de um arquivo .drawio (frente e traseira por rack, portas conectáveis, cabos).
  exportDrawio,
  // Promise<string>: biblioteca do draw.io (<mxlibrary>) com os modelos do dashboard (ou só os ids passados).

  // Enquadra um equipamento ("olt1") ou uma porta ("olt1:1/0") e seleciona. margin = folga relativa (padrão 0.25).
  focus(ref, margin = 0.25) {

    sel = isPort ? { kind: 'port', ref } : { kind: 'device', id: ref };
    refresh();
    const el = world.querySelector(isPort ? `[data-ref="${CSS.escape(ref)}"]` : `[data-dev="${CSS.escape(ref)}"]`);

    const k = svg.clientWidth / Math.max(1, svg.clientHeight);
    let w = Math.max(x1 - x0, isPort ? 60 : 120) * (1 + 2 * margin), h = Math.max(y1 - y0, isPort ? 40 : 60) * (1 + 2 * margin);
    if (w / h > k) h = w / k; else w = h * k;

    return true;
  },
};
